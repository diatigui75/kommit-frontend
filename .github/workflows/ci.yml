name: CI kommit-frontend

on:
  pull_request:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version de pnpm lue dans le champ packageManager du package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Tests unitaires Vitest seuls : les e2e Playwright (e2e/) en sont exclus par vite.config.ts.
      - name: Tests
        run: pnpm test
