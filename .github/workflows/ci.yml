name: CI kommit-frontend

on:
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # main reflète la prod : on n'y entre que depuis dev (KOM-26, CA1).
      - name: PR vers main depuis dev uniquement
        if: github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Une PR vers main doit partir de dev, pas de $HEAD_REF."
          exit 1

      - uses: actions/checkout@v5

      # Version de pnpm lue dans le champ packageManager du package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Tests unitaires Vitest seuls : les e2e Playwright (e2e/) en sont exclus par vite.config.ts.
      - name: Tests
        run: pnpm test:run
